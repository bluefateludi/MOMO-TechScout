name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_COLOR: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js for packaged Web assets
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install project and quality dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --constraint scripts/ci/python-constraints.txt -e ".[dev]"

      - name: Ruff correctness checks
        run: python -m ruff check .

      - name: Offline Python tests
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: python -m pytest

      - name: Build packaged Web assets
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Build wheel without dependency resolution
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .

      - name: Smoke-test installed CLI from wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          paper-agent --help
          techscout --help
          python "$GITHUB_WORKSPACE/scripts/ci/smoke_installed_web.py"

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python for OpenAPI snapshot
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python application dependencies
        working-directory: .
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --constraint scripts/ci/python-constraints.txt .

      - name: Install locked Web dependencies
        run: npm ci --ignore-scripts

      - name: Check OpenAPI contract snapshot
        run: npm run contracts:check

      - name: Run offline Web tests
        run: npm test

      - name: Type-check and build Web application
        run: npm run build

  sandbox-build:
    name: Sandbox build and no-network smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python for Sandbox contract checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal Sandbox test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --timeout 30 --retries 2
          "pydantic>=2" "pytest>=8" typing-extensions

      - name: Verify compiler and runner boundary contracts
        run: >-
          python -m pytest
          tests/techscout/test_sandbox.py::test_compiler_emits_only_reviewed_explicit_argv
          tests/techscout/test_sandbox.py::test_docker_argv_applies_resource_mount_and_network_boundaries
          tests/techscout/test_sandbox.py::test_runner_invokes_subprocess_with_timeout_and_no_shell
          tests/techscout/test_sandbox.py::test_timeout_force_removes_daemon_owned_container

      - name: Build dependency-free sandbox smoke target
        run: >-
          docker build
          --network none
          --target ci-smoke
          --tag momo-techscout-sandbox:ci
          docker/sandbox

      - name: Run bounded no-network sandbox smoke
        shell: bash
        run: |
          timeout --signal=KILL 30s docker run --rm --init \
            --name techscout-ci-smoke \
            --cpus 0.5 \
            --memory 128m \
            --pids-limit 32 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --env HOME=/tmp \
            momo-techscout-sandbox:ci

      - name: Remove smoke container after interruption
        if: always()
        run: docker rm --force techscout-ci-smoke 2>/dev/null || true

  # Deferred until the corresponding implementation slices exist:
  # - three deterministic Agent vertical smokes backed only by frozen fakes
  # Empty placeholder jobs would make these future gates appear to pass.
